
name: Customer Churn ML - CI

on:
  push:
    branches: [main1]
  pull_request:
    branches: [main1]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train ML model
        run: python -m src.train

      - name: Run tests
        run:
            python -m pytest -q

      - name: Build Docker image
        run: docker build -t customer-churn-api .
